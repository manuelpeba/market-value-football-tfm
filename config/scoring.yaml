scoring:
  input_predictions_path: artifacts/predictions/tuned_xgboost_predictions.csv
  output_path: reports/rankings/scoring_dataset.csv

  columns:
    observed_market_value: market_value_eur
    observed_log_market_value: log_market_value_eur
    predicted_log_market_value: predicted_log_market_value

  clipping:
    min_predicted_market_value_eur: 100000
    max_market_value_gap_pct: 5.0

  normalization:
    method: zscore
    winsorize_lower: 0.01
    winsorize_upper: 0.99

  export:
    top_n_preview: 50

growth_score:
  input_path: reports/rankings/scoring_dataset.csv
  output_path: reports/rankings/scoring_dataset_growth.csv

  variables:
    positive:
      - market_value_growth_prev
      - delta_log_market_value_prev
      - growth_index
      - breakout_indicator

    negative:
      - career_year

  weights:
    market_value_growth_prev: 0.30
    delta_log_market_value_prev: 0.30
    growth_index: 0.25
    breakout_indicator: 0.10
    career_year: 0.05

  normalization:
    winsorize_lower: 0.01
    winsorize_upper: 0.99

confidence_score:
  input_path: reports/rankings/scoring_dataset_growth.csv
  output_path: reports/rankings/scoring_dataset_confidence.csv

  weights:
    matching_confidence: 0.35
    minutes_reliability: 0.35
    feature_completeness: 0.20
    temporal_stability: 0.10

  minutes:
    full_reliability_minutes: 1800

  required_features:
    - age
    - minutes_played
    - log_minutes_played
    - goals_per90
    - assists_per90
    - market_value_growth_prev
    - delta_log_market_value_prev
    - growth_index
    - breakout_indicator
  
opportunity_score:
  input_path: reports/rankings/scoring_dataset_confidence.csv
  output_path: reports/rankings/scoring_dataset_opportunity.csv

  weights:
    inefficiency_score_z: 0.55
    growth_score_z: 0.25
    confidence_score_z: 0.20

  tiers:
    low: 20
    interesting: 40
    monitoring: 60
    high_priority: 80